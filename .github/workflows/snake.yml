# Renders the contribution graph as a snake eating the squares, into the
# `output` branch, which the README then points at. Runs on a schedule
# because the graph changes daily and nothing else here would redraw it.
name: snake

on:
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
